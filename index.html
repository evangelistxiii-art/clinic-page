<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>百分百牙醫｜材料庫存</title>
<style>
:root {
  --ink: #1f2933;
  --quiet: #616e7c;
  --line: #d9e2ec;
  --bg: #f5f7fa;
  --card: #ffffff;
  --brand: #1f6f8b;
  --brand-soft: #e3f1f6;
  --ok: #1e7b4f;
  --ok-soft: #e3f5ec;
  --warn: #b25e09;
  --warn-soft: #fff4e5;
  --bad: #b42318;
  --bad-soft: #fdecea;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
}

h1 { font-size: 28px; margin: 0 0 24px; }
h2 { font-size: 21px; margin: 24px 0 12px; }

button, input, select { font: inherit; }

input, select {
  padding: 8px 10px;
  border: 1px solid #b6c2cf;
  border-radius: 6px;
  background: #fff;
  min-height: 44px;
  width: 100%;
}
input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }

button {
  padding: 8px 18px;
  min-height: 44px;
  border: 1px solid #b6c2cf;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
}
button:hover { background: #eef2f6; }
button:disabled { opacity: .5; cursor: wait; }
button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
button.primary:hover { background: #185a71; }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
button.link { border: none; background: none; color: var(--brand); padding: 4px 8px; min-height: 0; }
button.small { padding: 4px 10px; min-height: 36px; font-size: 16px; }

/* 登入 */
.login { max-width: 440px; margin: 12vh auto; background: var(--card); padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.login form { display: grid; gap: 16px; }

/* 上方列 */
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 8px 24px; background: var(--card); border-bottom: 1px solid var(--line);
}
#nav { display: flex; flex-wrap: wrap; gap: 4px; }
#nav button { border: none; background: none; font-size: 19px; padding: 10px 16px; border-radius: 6px; }
#nav button.active { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.who { display: flex; align-items: center; gap: 6px; color: var(--quiet); white-space: nowrap; }
body:not(.is-admin) .admin-only { display: none !important; }

main { max-width: 1200px; margin: 0 auto; padding: 8px 24px 80px; }

/* 訊息 */
.msg {
  position: fixed; top: 72px; left: 50%; transform: translateX(-50%); z-index: 20;
  min-width: 320px; max-width: 90vw; padding: 14px 24px; border-radius: 8px;
  font-size: 19px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.15);
  white-space: pre-line;
}
.msg.ok { background: var(--ok-soft); color: var(--ok); border: 2px solid var(--ok); }
.msg.err { background: var(--bad-soft); color: var(--bad); border: 2px solid var(--bad); }
.msg.info { background: var(--brand-soft); color: var(--brand); border: 2px solid var(--brand); }

/* 表單 */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; max-width: 820px; }
.form label, .filters label { display: grid; gap: 4px; font-weight: 600; }
.form .wide { grid-column: 1 / -1; }
.check { display: flex !important; align-items: center; gap: 8px; font-weight: 600; }
.check input { width: auto; min-height: 0; }
.unit-wrap { display: flex; align-items: center; gap: 8px; }
.unit { color: var(--quiet); font-weight: 400; white-space: nowrap; }
.item-info { margin: -8px 0 0; color: var(--quiet); }
.preview { margin: 0; padding: 12px 16px; background: var(--brand-soft); border-radius: 8px; color: var(--brand); font-weight: 600; }
.preview:empty { display: none; }
.hint { color: var(--quiet); font-size: 16px; }

.filters { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-bottom: 16px; }
.filters input, .filters select { width: auto; min-width: 180px; }

/* 表格 */
.grid { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
.grid th, .grid td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.grid th { background: #eef2f6; font-size: 16px; color: var(--quiet); }
.grid td.num, .grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
.grid tr.click { cursor: pointer; }
.grid tr.click:hover td { background: #f8fafc; }
.grid tr.low td:nth-child(4) { color: var(--bad); font-weight: 700; }
.grid tr.detail td { background: #f8fafc; }
.grid tr.muted td { color: var(--quiet); }
.grid.entry td { padding: 6px 8px; }
.grid.entry input, .grid.entry select { min-width: 0; }
.subtable { width: 100%; border-collapse: collapse; font-size: 16px; }
.subtable td, .subtable th { padding: 4px 8px; border-bottom: 1px dashed var(--line); text-align: left; }
.tag { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 14px; background: #eef2f6; color: var(--quiet); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.neg { color: var(--bad); }
.pos { color: var(--ok); }

/* 警示 */
.alerts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.alert-box { background: var(--card); border-radius: 10px; padding: 4px 20px 12px; border-left: 6px solid var(--warn); }
.alert-box h2 { font-size: 19px; margin: 14px 0 8px; }
.alert-list { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow: auto; }
.alert-list li { padding: 6px 0; border-bottom: 1px solid var(--line); }
.alert-list li.none { color: var(--ok); border: none; }
.badge { display: inline-block; min-width: 28px; padding: 0 8px; border-radius: 14px; background: var(--warn); color: #fff; font-size: 16px; text-align: center; }
.badge.zero { background: var(--ok); }

/* 報表 */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 16px 0; }
.kpi { background: var(--card); border-radius: 10px; padding: 16px 20px; }
.kpi .label { color: var(--quiet); font-size: 16px; }
.kpi .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--brand); border-radius: 5px; }

/* 視窗 */
dialog { border: none; border-radius: 12px; padding: 28px; max-width: 720px; width: 92vw; box-shadow: 0 8px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(15, 23, 42, .45); }
dialog h2 { margin-top: 0; }
#reverse-form { display: grid; gap: 14px; }
#reverse-form label { display: grid; gap: 4px; font-weight: 600; }
.row-btns { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
</style>
</head>
<body>

<div id="msg" class="msg" hidden></div>

<!-- 登入 -->
<section id="login" class="login" hidden>
  <h1>百分百牙醫｜材料庫存</h1>
  <form id="login-form">
    <label>請輸入通行碼
      <input type="password" id="login-token" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">進入</button>
  </form>
  <p class="hint">這台電腦會記住通行碼，下次不用再輸入。</p>
</section>

<!-- 主畫面 -->
<div id="app" hidden>
  <header class="topbar">
    <nav id="nav">
      <button data-tab="home" class="active">首頁</button>
      <button data-tab="receive">進貨</button>
      <button data-tab="consume">領用</button>
      <button data-tab="adjust">盤點</button>
      <button data-tab="records">紀錄查詢</button>
      <button data-tab="report" class="admin-only">成本報表</button>
      <button data-tab="items" class="admin-only">品項管理</button>
    </nav>
    <div class="who">
      <span id="role-label"></span>
      <button id="btn-refresh" class="link" title="重新讀取資料">重新整理</button>
      <button id="btn-logout" class="link">登出</button>
    </div>
  </header>

  <main>
    <!-- 首頁 -->
    <section id="tab-home" class="tab">
      <div class="alerts">
        <div class="alert-box">
          <h2>低於安全庫存 <span id="low-count" class="badge"></span></h2>
          <ul id="low-list" class="alert-list"></ul>
        </div>
        <div class="alert-box">
          <h2><span id="exp-days"></span> 天內到期（含已過期） <span id="exp-count" class="badge"></span></h2>
          <ul id="exp-list" class="alert-list"></ul>
        </div>
      </div>
      <h2>目前庫存</h2>
      <div class="filters">
        <input type="search" id="home-search" placeholder="搜尋名稱、規格、廠商">
        <select id="home-cat"><option value="">全部分類</option></select>
      </div>
      <table class="grid">
        <thead><tr><th>名稱</th><th>規格</th><th>分類</th><th class="num">庫存</th><th class="num">安全量</th><th>最近效期</th></tr></thead>
        <tbody id="stock-body"></tbody>
      </table>
      <p class="hint">點一列可以看各批次明細。</p>
    </section>

    <!-- 進貨 -->
    <section id="tab-receive" class="tab" hidden>
      <h2>進貨</h2>
      <form id="receive-form" class="form">
        <label>操作人 <select name="staff" class="staff-select" required></select></label>
        <label>進貨日期 <input type="date" name="date" required></label>
        <label class="wide">品項 <input name="item" class="item-input" list="dl-items" placeholder="輸入關鍵字後從清單選" autocomplete="off" required></label>
        <p class="wide item-info" id="receive-info"></p>
        <label>數量 <span class="unit-wrap"><input type="number" name="packs" min="0.01" step="0.01" required><span id="receive-pack-unit" class="unit"></span></span></label>
        <label>單價（元／<span id="receive-pack-unit2">進貨單位</span>） <input type="number" name="price" min="0" step="0.01" required></label>
        <label>批號 <input name="lot" maxlength="50" required></label>
        <label>效期 <input type="date" name="expiry" required></label>
        <label class="wide">備註（可不填） <input name="note" maxlength="100"></label>
        <p class="wide preview" id="receive-preview"></p>
        <div class="wide"><button type="submit" class="primary">送出</button></div>
      </form>
    </section>

    <!-- 領用 -->
    <section id="tab-consume" class="tab" hidden>
      <h2>領用（可一次登記多筆）</h2>
      <form id="consume-form">
        <div class="form">
          <label>操作人 <select name="staff" class="staff-select" required></select></label>
          <label>領用日期 <input type="date" name="date" required></label>
        </div>
        <table class="grid entry">
          <thead><tr><th>#</th><th>品項</th><th>批次（預選最早到期）</th><th>數量</th><th></th></tr></thead>
          <tbody id="consume-body"></tbody>
        </table>
        <p><button type="button" id="consume-add">＋ 再加一列</button></p>
        <button type="submit" class="primary">一次送出全部</button>
      </form>
    </section>

    <!-- 盤點 -->
    <section id="tab-adjust" class="tab" hidden>
      <h2>盤點調整</h2>
      <p class="hint">實際數量和系統不同時才需要登記。</p>
      <form id="adjust-form" class="form">
        <label>操作人 <select name="staff" class="staff-select" required></select></label>
        <span></span>
        <label class="wide">品項 <input name="item" class="item-input" list="dl-items" placeholder="輸入關鍵字後從清單選" autocomplete="off" required></label>
        <label class="wide">批次 <select name="batch" id="adjust-batch" required></select></label>
        <label>實際數量 <span class="unit-wrap"><input type="number" name="actual" min="0" step="0.01" required><span id="adjust-unit" class="unit"></span></span></label>
        <p class="preview" id="adjust-preview"></p>
        <label>原因 <select name="reasonType" id="adjust-reason" required></select></label>
        <label>說明（選「其他」時必填） <input name="reasonText" maxlength="150"></label>
        <div class="wide"><button type="submit" class="primary">送出</button></div>
      </form>
    </section>

    <!-- 紀錄查詢 -->
    <section id="tab-records" class="tab" hidden>
      <h2>紀錄查詢</h2>
      <form id="records-form" class="filters">
        <label>起 <input type="date" name="from"></label>
        <label>迄 <input type="date" name="to"></label>
        <label>類型
          <select name="type"><option value="">全部</option><option>進貨</option><option>領用</option><option>盤點調整</option><option>沖銷</option></select>
        </label>
        <label>品項 <input name="item" class="item-input" list="dl-items-all" placeholder="全部" autocomplete="off"></label>
        <label>操作人 <select name="staff" id="records-staff"><option value="">全部</option></select></label>
        <button type="submit" class="primary">查詢</button>
      </form>
      <p id="records-note" class="hint"></p>
      <table class="grid">
        <thead id="records-head"></thead>
        <tbody id="records-body"></tbody>
      </table>
    </section>

    <!-- 成本報表 -->
    <section id="tab-report" class="tab" hidden>
      <h2>成本報表</h2>
      <form id="report-form" class="filters">
        <label>月份 <input type="month" name="month" required></label>
        <button type="submit" class="primary">查詢</button>
      </form>
      <div id="report-out"></div>
    </section>

    <!-- 品項管理 -->
    <section id="tab-items" class="tab" hidden>
      <h2>品項管理</h2>
      <div class="filters">
        <button id="item-new" class="primary">＋ 新增品項</button>
        <input type="search" id="items-search" placeholder="搜尋">
        <label class="check"><input type="checkbox" id="items-inactive"> 顯示已停用</label>
      </div>
      <table class="grid">
        <thead><tr><th>ID</th><th>名稱</th><th>規格</th><th>分類</th><th>廠商</th><th>單位換算</th><th class="num">安全量</th><th>啟用</th><th></th></tr></thead>
        <tbody id="items-body"></tbody>
      </table>
    </section>
  </main>
</div>

<datalist id="dl-items"></datalist>
<datalist id="dl-items-all"></datalist>

<!-- 沖銷視窗 -->
<dialog id="reverse-dialog">
  <form id="reverse-form" method="dialog">
    <h2>沖銷這筆紀錄</h2>
    <p id="reverse-desc"></p>
    <label>操作人 <select name="staff" class="staff-select" required></select></label>
    <label>沖銷原因 <input name="reason" maxlength="150" required></label>
    <div class="row-btns">
      <button type="button" class="cancel">取消</button>
      <button type="submit" class="danger">確定沖銷</button>
    </div>
  </form>
</dialog>

<!-- 品項編輯視窗 -->
<dialog id="item-dialog">
  <form id="item-form" method="dialog" class="form">
    <h2 class="wide" id="item-title">新增品項</h2>
    <input type="hidden" name="itemId">
    <label class="wide">名稱 <input name="name" maxlength="80" required></label>
    <label>分類 <select name="cat" id="item-cat" required></select></label>
    <label>廠商 <input name="vendor" maxlength="60"></label>
    <label class="wide">規格（尺寸、顏色、型號） <input name="spec" maxlength="60"></label>
    <label>進貨單位 <input name="packUnit" maxlength="10" placeholder="盒" required></label>
    <label>使用單位 <input name="useUnit" maxlength="10" placeholder="支" required></label>
    <label>換算數量（1 進貨單位 = 幾個使用單位） <input type="number" name="conv" min="0.01" step="0.01" required></label>
    <label>安全庫存量（使用單位） <input type="number" name="safety" min="0" step="0.01" value="0"></label>
    <label class="check wide"><input type="checkbox" name="active" checked> 啟用</label>
    <p class="wide hint" id="item-conv-note"></p>
    <div class="wide row-btns">
      <button type="button" class="cancel">取消</button>
      <button type="submit" class="primary">儲存</button>
    </div>
  </form>
</dialog>

<!-- 確認視窗 -->
<dialog id="confirm-dialog">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="row-btns">
      <button value="no">取消</button>
      <button value="yes" class="primary">確定</button>
    </div>
  </form>
</dialog>

<script>
// ↓↓↓ 把 Apps Script「網頁應用程式」的網址（結尾是 /exec）貼在兩個引號中間 ↓↓↓
const API_URL = 'https://script.google.com/macros/s/AKfycbw9Vb2LLt57Pr61nldn8yVfDyFFRzlHzh5gwsEYfl7PfJ6wxON-zEWQbF2mFdZ9sWro/exec';
// ↑↑↑ 只要改這一行，其他都不用動 ↑↑↑


const S = { token: null, role: null, d: null, itemByLabel: {}, itemById: {}, busy: false };
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

/* ---------------- 小工具 ---------------- */

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmt(n) { return Number(n || 0).toLocaleString('zh-TW', { maximumFractionDigits: 2 }); }
function money(n) { return 'NT$ ' + Number(n || 0).toLocaleString('zh-TW', { maximumFractionDigits: 0 }); }
function r2(n) { return Math.round(n * 100) / 100; }
function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, val);
  } catch (e) { return null; }
}
function itemLabel(it) {
  return it.name + (it.spec ? '（' + it.spec + '）' : '') + ' [' + it.id + ']';
}

let msgTimer = null;
function showMsg(text, kind) {
  const el = $('#msg');
  el.textContent = text;
  el.className = 'msg ' + (kind || 'info');
  el.hidden = false;
  clearTimeout(msgTimer);
  if (kind === 'ok') msgTimer = setTimeout(() => { el.hidden = true; }, 5000);
}
function hideMsg() { $('#msg').hidden = true; }
$('#msg').addEventListener('click', hideMsg);

function confirmBox(text) {
  return new Promise(resolve => {
    const dlg = $('#confirm-dialog');
    $('#confirm-text').textContent = text;
    dlg.returnValue = '';
    dlg.addEventListener('close', () => resolve(dlg.returnValue === 'yes'), { once: true });
    dlg.showModal();
  });
}

/* ---------------- 呼叫後端 ---------------- */

async function api(action, data) {
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) {
    throw new Error('還沒設定 Apps Script 網址：請在 app.js 第 2 行貼上網址。');
  }
  let res, json;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: S.token, action: action, data: data || {} }),
    });
    json = await res.json();
  } catch (e) {
    throw new Error('網路連線失敗，這次的資料「沒有」存檔。\n請確認網路後重新送出。');
  }
  if (!json.ok) {
    const err = new Error(json.error || '發生錯誤');
    err.server = true;
    throw err;
  }
  return json.data;
}

// 送出表單時：鎖住按鈕、顯示結果
async function submitWith(btn, fn) {
  if (S.busy) return;
  S.busy = true;
  const all = $$('button[type=submit]');
  all.forEach(b => { b.disabled = true; });
  showMsg('處理中，請稍候…', 'info');
  try {
    await fn();
  } catch (e) {
    showMsg(e.message, 'err');
  } finally {
    S.busy = false;
    all.forEach(b => { b.disabled = false; });
  }
}

/* ---------------- 登入 ---------------- */

async function start() {
  S.token = store('inv_token');
  if (!S.token) return showLogin();
  try {
    await loadData();
    showApp();
  } catch (e) {
    if (e.server && /通行碼/.test(e.message)) { store('inv_token', null); showLogin(); }
    else { showLogin(); }
    showMsg(e.message, 'err');
  }
}

function showLogin() {
  $('#app').hidden = true;
  $('#login').hidden = false;
  $('#login-token').value = '';
  $('#login-token').focus();
}

$('#login-form').addEventListener('submit', e => {
  e.preventDefault();
  submitWith(null, async () => {
    S.token = $('#login-token').value.trim();
    await loadData();
    store('inv_token', S.token);
    hideMsg();
    showApp();
  });
});

$('#btn-logout').addEventListener('click', () => {
  store('inv_token', null);
  S.token = null; S.d = null;
  document.body.classList.remove('is-admin');
  showLogin();
});

$('#btn-refresh').addEventListener('click', () => {
  submitWith(null, async () => { await loadData(); showMsg('資料已更新', 'ok'); });
});

function showApp() {
  $('#login').hidden = true;
  $('#app').hidden = false;
  showTab(location.hash.slice(1) || 'home');
}

/* ---------------- 讀資料 ---------------- */

async function loadData() {
  const d = await api('bootstrap');
  S.d = d;
  S.role = d.role;
  document.body.classList.toggle('is-admin', d.role === 'admin');

    store('inv_staff', e.target.value);

function itemFromInput(input) {
  const it = S.itemByLabel[input.value.trim()];
  return it || null;
}
function batchesOf(itemId, onlyLeft) {
  return S.d.batches
    .filter(b => b.itemId === itemId && (!onlyLeft || b.remain > 0))
    .sort((a, b) => (a.expiry < b.expiry ? -1 : a.expiry > b.expiry ? 1 : (a.id < b.id ? -1 : 1)));
}
function stockOf(itemId) {
  return r2(S.d.batches.filter(b => b.itemId === itemId).reduce((s, b) => s + b.remain, 0));
}
function daysLeft(expiry) {
  return Math.round((Date.parse(expiry + 'T00:00:00Z') - Date.parse(S.d.today + 'T00:00:00Z')) / 864e5);
}
function expiryTag(expiry) {
  const n = daysLeft(expiry);
  if (n < 0) return '<span class="tag bad">已過期</span>';
  if (n <= S.d.expiryDays) return '<span class="tag warn">剩 ' + n + ' 天</span>';
  return '';
}

function showTab(name) {
  const btn = $('#nav button[data-tab="' + name + '"]');
  if (!btn || (btn.classList.contains('admin-only') && S.role !== 'admin')) name = 'home';
  $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $$('.tab').forEach(t => { t.hidden = t.id !== 'tab-' + name; });
  history.replaceState(null, '', '#' + name);
  if (name === 'consume' && !$('#consume-body').children.length) addConsumeRow();
  if (name === 'report' && !$('#report-form').month.value) $('#report-form').month.value = S.d.today.slice(0, 7);
}

function renderStock() {
  const q = $('#home-search').value.trim().toLowerCase();

    .filter(i => i.active && (!cat || i.cat === cat))

    .sort((a, b) => (a.cat + a.name).localeCompare(b.cat + b.name, 'zh-Hant'));

    const st = stockOf(i.id);

      '<td>' + esc(i.name) + '</td><td>' + esc(i.spec) + '</td><td>' + esc(i.cat) + '</td>' +
      '<td class="num">' + fmt(st) + ' ' + esc(i.useUnit) + '</td><td class="num">' + fmt(i.safety) + '</td>' +
      '<td>' + (next ? esc(next.expiry) + ' ' + expiryTag(next.expiry) : '—') + '</td></tr>';

const rf = $('#receive-form');
function receivePreview() {
  const it = itemFromInput(rf.item);
  $('#receive-info').textContent = it ? ('1 ' + it.packUnit + ' = ' + fmt(it.conv) + ' ' + it.useUnit + (it.vendor ? '　廠商：' + it.vendor : '')) : '';
  $('#receive-pack-unit').textContent = it ? it.packUnit : '';
  $('#receive-pack-unit2').textContent = it ? it.packUnit : '進貨單位';
  const packs = Number(rf.packs.value), price = Number(rf.price.value);
  if (!it || !(packs > 0)) { $('#receive-preview').textContent = ''; return; }
  let t = '入庫 ' + fmt(r2(packs * it.conv)) + ' ' + it.useUnit;
  if (S.role === 'admin' && rf.price.value !== '' && price >= 0) {
    t += '，每' + it.useUnit + ' ' + fmt(r2(price / it.conv)) + ' 元，小計 ' + fmt(r2(packs * price)) + ' 元';
  }
  $('#receive-preview').textContent = t;

['input', 'change'].forEach(ev => rf.addEventListener(ev, receivePreview));

rf.addEventListener('submit', e => {
  e.preventDefault();
  submitWith(null, async () => {
    const it = itemFromInput(rf.item);
    if (!it) throw new Error('請從清單中選擇品項。');
    const body = { staff: rf.staff.value, date: rf.date.value, itemId: it.id, packs: rf.packs.value, price: rf.price.value,
      lot: rf.lot.value, expiry: rf.expiry.value, note: rf.note.value };

    if (res.needConfirm) {
      hideMsg();
      if (!(await confirmBox(res.message))) { showMsg('沒有送出。', 'info'); return; }
      body.confirmExpired = true;
      res = await api('receive', body);
    }
    showMsg('進貨已存檔：' + it.name + ' 入庫 ' + fmt(res.qty) + ' ' + res.useUnit, 'ok');
    ['item', 'packs', 'price', 'lot', 'expiry', 'note'].forEach(f => { rf[f].value = ''; });

});

function addConsumeRow() {
  const tb = $('#consume-body');
  const tr = document.createElement('tr');
  tr.innerHTML = '<td class="n"></td>' +
    '<td><input class="c-item" list="dl-items" placeholder="輸入關鍵字後從清單選" autocomplete="off"></td>' +
    '<td><select class="c-batch"><option value="">先選品項</option></select></td>' +
    '<td><span class="unit-wrap"><input class="c-qty" type="number" min="0.01" step="0.01" style="width:110px"><span class="unit c-unit"></span></span></td>' +
    '<td><button type="button" class="small c-del">刪除此列</button></td>';
  tb.appendChild(tr);
  numberRows();
  tr.querySelector('.c-item').focus();
}
function numberRows() {
  $$('#consume-body tr').forEach((tr, i) => { tr.querySelector('.n').textContent = i + 1; });
}
function fillBatchSelect(sel, it, onlyLeft) {
  const bs = it ? batchesOf(it.id, onlyLeft) : [];
  if (!it) { sel.innerHTML = '<option value="">先選品項</option>'; return; }
  if (!bs.length) { sel.innerHTML = '<option value="">' + (onlyLeft ? '沒有庫存' : '還沒有批次') + '</option>'; return; }
  sel.innerHTML = bs.map(b => '<option value="' + esc(b.id) + '">' + esc(b.lot) + '｜效期 ' + esc(b.expiry) +
    '｜剩 ' + fmt(b.remain) + ' ' + esc(it.useUnit) + '</option>').join('');

}

$('#consume-body').addEventListener('click', e => {
  if (e.target.classList.contains('c-del')) {
    e.target.closest('tr').remove();
    if (!$('#consume-body').children.length) addConsumeRow();
    numberRows();
  }
});
$('#consume-body').addEventListener('change', e => {
  if (!e.target.classList.contains('c-item')) return;
  const tr = e.target.closest('tr');
  const it = itemFromInput(e.target);
  fillBatchSelect(tr.querySelector('.c-batch'), it, true);
  tr.querySelector('.c-unit').textContent = it ? it.useUnit : '';
  if (it) tr.querySelector('.c-qty').focus();
});

$('#consume-form').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  submitWith(null, async () => {
    const rows = [];
    $$('#consume-body tr').forEach((tr, i) => {
      const input = tr.querySelector('.c-item');
      const qty = tr.querySelector('.c-qty').value;
      if (!input.value.trim() && !qty) return; // 空白列略過
      const it = itemFromInput(input);
      if (!it) throw new Error('第 ' + (i + 1) + ' 列：請從清單中選擇品項。');
      rows.push({ itemId: it.id, batchId: tr.querySelector('.c-batch').value, qty: qty });
    });
    if (!rows.length) throw new Error('請至少登記一筆領用。');
    const res = await api('consume', { staff: f.staff.value, date: f.date.value, rows: rows });
    showMsg('領用已存檔，共 ' + res.count + ' 筆。', 'ok');
    $('#consume-body').innerHTML = '';
    addConsumeRow();
    await loadData();
  });
});

const af = $('#adjust-form');
function adjustRefresh(e) {
  const it = itemFromInput(af.item);
  if (!e || e.target === af.item) fillBatchSelect($('#adjust-batch'), it, false);
  $('#adjust-unit').textContent = it ? it.useUnit : '';
  const b = S.d.batches.find(x => x.id === af.batch.value);
  if (!it || !b) { $('#adjust-preview').textContent = ''; return; }
  let t = '系統數量：' + fmt(b.remain) + ' ' + it.useUnit;
  if (af.actual.value !== '') {
    const diff = r2(Number(af.actual.value) - b.remain);
    t += '　差額：' + (diff > 0 ? '+' : '') + fmt(diff);
  }
  $('#adjust-preview').textContent = t;
}
['input', 'change'].forEach(ev => af.addEventListener(ev, adjustRefresh));

af.addEventListener('submit', e => {
  e.preventDefault();
  submitWith(null, async () => {
    const it = itemFromInput(af.item);
    if (!it) throw new Error('請從清單中選擇品項。');
    const type = af.reasonType.value, text = af.reasonText.value.trim();
    if (type === '其他' && !text) throw new Error('原因選「其他」時，請填寫說明。');
    const reason = text ? type + '：' + text : type;
    const res = await api('adjust', { staff: af.staff.value, itemId: it.id, batchId: af.batch.value, actual: af.actual.value, reason: reason });
    showMsg('盤點已存檔：' + it.name + ' 調整 ' + (res.diff > 0 ? '+' : '') + fmt(res.diff) + ' ' + it.useUnit, 'ok');
    ['item', 'actual', 'reasonText'].forEach(f => { af[f].value = ''; });
    af.reasonType.value = '';
    await loadData();
    adjustRefresh();
  });
});

$('#items-body').addEventListener('click', e => {
  const b = e.target.closest('button.edit');
  if (b) openItem(S.itemById[b.dataset.id]);
});
itemDlg.querySelector('.cancel').addEventListener('click', () => itemDlg.close());
itf.addEventListener('submit', e => {
  e.preventDefault();
  submitWith(null, async () => {
    const body = {};
    ['name', 'cat', 'vendor', 'spec', 'packUnit', 'useUnit', 'conv', 'safety'].forEach(k => { body[k] = itf.elements[k].value; });
    body.id = itf.elements.itemId.value;
    body.active = itf.elements.active.checked;
    const res = await api('saveItem', body);
    itemDlg.close();
    showMsg('品項已儲存（' + res.id + '）', 'ok');
    await loadData();
  });
});

start();
</script>
</body>
</html>
