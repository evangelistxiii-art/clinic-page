<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百分百牙醫｜材料庫存登記</title>
<style>
:root{--p:#0f766e;--p2:#14b8a6;--bg:#f4f7f7;--card:#fff;--line:#dfe6e6;--txt:#1f2a2a;--mut:#6b7b7b;--red:#c0392b;--redbg:#fdecea;--yel:#8a5a00;--yelbg:#fff4d1;--grn:#1e7d4f;--grnbg:#e6f6ee}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{background:var(--p);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:19px;margin:0}
header .sub{font-size:13px;opacity:.85}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 16px;font-size:15px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
nav button.on{color:var(--p);border-bottom-color:var(--p);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:18px}
main>section{display:none}
main>section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:16px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .l{font-size:13px;color:var(--mut)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi.red .v{color:var(--red)}
.kpi.yel .v{color:var(--yel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f0f5f5;font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-red{background:var(--redbg);color:var(--red)}
.t-yel{background:var(--yelbg);color:var(--yel)}
.t-grn{background:var(--grnbg);color:var(--grn)}
.t-gry{background:#eee;color:#666}
tr.void td{color:#aaa;text-decoration:line-through}
tr.void td:last-child{text-decoration:none}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}
.full{grid-column:1/-1}
label.chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--txt)}
input,select,textarea{font:inherit;font-size:15px;padding:8px 10px;border:1px solid #c9d4d4;border-radius:7px;background:#fff;color:var(--txt)}
input[type=checkbox]{width:18px;height:18px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);border-color:var(--p2)}
.btn{font:inherit;border:1px solid var(--p);background:var(--p);color:#fff;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.o{background:#fff;color:var(--p)}
.btn.r{background:#fff;color:var(--red);border-color:var(--red)}
.btn.s{padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.muted{color:var(--mut);font-size:13px}
.banner{background:var(--yelbg);border:1px solid #f0d98a;color:#6b4c00;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2a2a;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90%}
.toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:20}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:12px;max-width:820px;width:100%;padding:20px}
.lotinfo{background:#f0f5f5;padding:10px 12px;border-radius:7px;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:24px}
.bar{height:14px;background:var(--p2);border-radius:3px;min-width:2px}
.neg{color:var(--red)}
.pos{color:var(--grn)}
.print-only{display:none}
@media print{
  header,nav,.noprint,.banner,#bkBanner{display:none!important}
  main>section{display:none!important}
  main>section.on{display:block!important}
  .card{border:0;padding:0}
  .print-only{display:block}
  body{background:#fff}
  input{border:1px solid #999}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>百分百牙醫｜材料庫存登記</h1>
    <div class="sub">臨床組使用・資料存在這台電腦的瀏覽器裡，請定期備份</div>
  </div>
  <div class="sub" id="hdrDate"></div>
</header>

<nav id="nav">
  <button data-t="dash" class="on">總覽</button>
  <button data-t="items">庫存清單</button>
  <button data-t="in">入庫</button>
  <button data-t="out">出庫</button>
  <button data-t="count">盤點</button>
  <button data-t="log">異動紀錄</button>
  <button data-t="report">成本報表</button>
  <button data-t="set">設定與備份</button>
</nav>

<main>
  <div id="bkBanner"></div>

  <!-- 總覽 -->
  <section id="s-dash" class="on"></section>

  <!-- 庫存清單 -->
  <section id="s-items">
    <div class="card">
      <div class="row noprint">
        <input id="qItem" placeholder="搜尋品名、廠牌、規格、位置…" style="flex:1;min-width:200px">
        <select id="fCat"></select>
        <label class="chk"><input type="checkbox" id="fLow"> 只看低庫存</label>
        <label class="chk"><input type="checkbox" id="fInactive"> 顯示停用品項</label>
      </div>
      <div class="row noprint">
        <button class="btn" onclick="openItem()">＋ 新增品項</button>
        <button class="btn o" onclick="exportItems()">匯出庫存表 CSV</button>
        <span class="muted" id="itemsCount"></span>
      </div>
      <div class="tw" id="itemsTbl"></div>
    </div>
  </section>

  <!-- 入庫 -->
  <section id="s-in">
    <div class="card">
      <h2>入庫登記</h2>
      <form id="fIn" class="form" autocomplete="off">
        <label>日期<input type="date" name="date" required></label>
        <label>經手人<select name="operator" class="staffSel" required></select></label>
        <label class="full">搜尋品項<input id="inSearch" placeholder="輸入關鍵字篩選下方品項"></label>
        <label class="full">品項<select name="itemId" id="inItem" required></select></label>
        <label>數量 <span id="inUnit"></span><input type="number" name="qty" min="0.01" step="any" required></label>
        <label>進貨單價（元／單位）<input type="number" name="cost" min="0" step="any" required></label>
        <label>批號<input name="lot" placeholder="沒有批號可以留空"></label>
        <label>效期<input type="date" name="expiry"></label>
        <label>供應商<input name="supplier"></label>
        <label>備註<input name="note" placeholder="例如：發票號碼、贈品"></label>
        <div class="full row" style="margin:0"><button class="btn">登記入庫</button><span class="muted" id="inHint"></span></div>
      </form>
    </div>
    <div class="card"><h2>今日入庫</h2><div class="tw" id="inToday"></div></div>
  </section>

  <!-- 出庫 -->
  <section id="s-out">
    <div class="card">
      <h2>出庫登記</h2>
      <form id="fOut" class="form" autocomplete="off">
        <label>日期<input type="date" name="date" required></label>
        <label>經手人<select name="operator" class="staffSel" required></select></label>
        <label class="full">搜尋品項<input id="outSearch" placeholder="輸入關鍵字篩選下方品項"></label>
        <label class="full">品項（只列出有庫存的）<select name="itemId" id="outItem" required></select></label>
        <label class="full">批號<select name="lotId" id="outLot" required></select></label>
        <div class="full lotinfo" id="outInfo">請先選擇品項</div>
        <label>數量 <span id="outUnit"></span><input type="number" name="qty" min="0.01" step="any" required></label>
        <label>出庫原因<select name="reason" id="outReason"></select></label>
        <label class="full">備註<input name="note" placeholder="例如：2 診、全口重建療程"></label>
        <div class="full row" style="margin:0"><button class="btn">登記出庫</button></div>
      </form>
    </div>
    <div class="card"><h2>今日出庫</h2><div class="tw" id="outToday"></div></div>
  </section>

  <!-- 盤點 -->
  <section id="s-count">
    <div class="card">
      <h2>盤點</h2>
      <div class="print-only" id="countPrintHead"></div>
      <div class="row noprint">
        <select id="cCat"></select>
        <label class="chk"><input type="checkbox" id="cZero"> 包含數量為 0 的批號</label>
        <button class="btn o" onclick="window.print()">列印盤點表</button>
      </div>
      <p class="muted noprint">依存放位置排序，方便照櫃位順序點。只要填「實際數量」有變動的那幾格就好，空白代表跟帳面一樣。帳上沒有的新批號請到「入庫」登記。</p>
      <div class="tw" id="countTbl"></div>
      <div class="row noprint" style="margin-top:14px">
        <label>盤點日期<input type="date" id="cDate"></label>
        <label>經手人<select id="cOp" class="staffSel"></select></label>
        <button class="btn" style="align-self:flex-end" onclick="saveCount()">儲存盤點結果</button>
      </div>
    </div>
  </section>

  <!-- 異動紀錄 -->
  <section id="s-log">
    <div class="card">
      <div class="row">
        <label>月份<input type="month" id="lMonth"></label>
        <label>類型<select id="lType"><option value="">全部</option><option value="in">入庫</option><option value="out">出庫</option><option value="adj">盤點調整</option></select></label>
        <label style="flex:1;min-width:180px">關鍵字<input id="lQ" placeholder="品名、批號、經手人、備註"></label>
        <label class="chk" style="align-self:flex-end;padding-bottom:8px"><input type="checkbox" id="lVoid"> 顯示已作廢</label>
        <button class="btn o" style="align-self:flex-end" onclick="exportLog()">匯出 CSV</button>
      </div>
      <p class="muted">登記錯誤時按「作廢」，系統會把那筆的數量還原。作廢後請重新登記正確的資料。</p>
      <div class="tw" id="logTbl"></div>
    </div>
  </section>

  <!-- 成本報表 -->
  <section id="s-report">
    <div class="card">
      <div class="row">
        <label>報表月份<input type="month" id="rMonth"></label>
        <button class="btn o" style="align-self:flex-end" onclick="exportReport()">匯出 CSV</button>
        <button class="btn o" style="align-self:flex-end" onclick="window.print()">列印</button>
      </div>
      <div id="reportBody"></div>
    </div>
  </section>

  <!-- 設定 -->
  <section id="s-set"></section>
</main>

<datalist id="unitList">
  <option>盒</option><option>支</option><option>包</option><option>瓶</option><option>顆</option><option>片</option><option>條</option><option>組</option><option>罐</option><option>管</option><option>捲</option><option>個</option>
</datalist>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========== 資料與工具 ========== */
const KEY = 'bfbDentalInventory_v1';
const DEF_CATS = ['一般耗材','印模材','樹脂／黏著劑','根管材料','植體與零件','骨粉／再生材料','藥品','感控用品','器械','其他'];
const OUT_REASONS = ['臨床使用','過期報廢','損壞報廢','退回廠商','其他'];
const TYPE_NAME = {in:'入庫', out:'出庫', adj:'盤點調整'};
let cur = 'dash';

function blank(){
  return {items:[], lots:[], txns:[], settings:{staff:['臨床組助理'], categories:DEF_CATS.slice(), nearDays:90, lastBackup:null}};
}
function load(){
  try{
    const s = localStorage.getItem(KEY);
    if(s){
      const d = JSON.parse(s), b = blank();
      d.settings = Object.assign(b.settings, d.settings||{});
      d.items = d.items||[]; d.lots = d.lots||[]; d.txns = d.txns||[];
      return d;
    }
  }catch(e){ console.warn(e); }
  return blank();
}
let db = load();

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch(e){ toast('⚠️ 儲存失敗：這個瀏覽器不允許存資料，請馬上到「設定與備份」下載備份'); return false; }
}

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const r2 = n => Math.round(n*10000)/10000;
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today = () => fmtDate(new Date());
const thisMonth = () => today().slice(0,7);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ const v = Math.round(n||0); return (v<0?'-$':'$') + Math.abs(v).toLocaleString('zh-TW'); }
function num(n){ return (Math.round((n||0)*100)/100).toLocaleString('zh-TW'); }
function daysTo(ds){ return Math.round((new Date(ds+'T00:00:00') - new Date(today()+'T00:00:00'))/86400000); }
function addMonths(ym, k){ let [y,m] = ym.split('-').map(Number); m += k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+String(m).padStart(2,'0'); }

const item = id => db.items.find(i => i.id===id);
const lot  = id => db.lots.find(l => l.id===id);
function fefo(a,b){ if(!a.expiry && !b.expiry) return 0; if(!a.expiry) return 1; if(!b.expiry) return -1; return a.expiry<b.expiry?-1:a.expiry>b.expiry?1:0; }
function lotsOf(id, onlyStock){ return db.lots.filter(l => l.itemId===id && (!onlyStock || l.qty>0)).sort(fefo); }
function stock(id){ return r2(db.lots.filter(l => l.itemId===id).reduce((s,l)=>s+l.qty,0)); }
function stockValue(id){ return db.lots.filter(l => l.itemId===id).reduce((s,l)=>s+l.qty*l.cost,0); }
function expStatus(exp){ if(!exp) return null; const d = daysTo(exp); if(d<0) return 'expired'; if(d<=db.settings.nearDays) return 'near'; return 'ok'; }
function expTag(exp){
  const s = expStatus(exp);
  if(!s) return '<span class="tag t-gry">無效期</span>';
  const d = daysTo(exp);
  if(s==='expired') return `<span class="tag t-red">${esc(exp)}・已過期 ${-d} 天</span>`;
  if(s==='near') return `<span class="tag t-yel">${esc(exp)}・剩 ${d} 天</span>`;
  return `<span class="tag t-grn">${esc(exp)}</span>`;
}
const isActive = it => it.active!==false;
const isLow = it => isActive(it) && it.safety>0 && stock(it.id) < it.safety;
function itemLabel(it){ const x = [it.brand, it.spec].filter(Boolean).join(' '); return it.name + (x ? '（'+x+'）' : ''); }
function allCats(){ const s = [...db.settings.categories]; db.items.forEach(i => { if(i.category && !s.includes(i.category)) s.push(i.category); }); return s; }
function lotName(l){ return l ? (l.lot || '無批號') : '—'; }

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2800); }
function openM(html){ $('#modal').innerHTML = html; $('#mbg').classList.add('on'); }
function closeM(){ $('#mbg').classList.remove('on'); }
$('#mbg').addEventListener('click', e => { if(e.target.id==='mbg') closeM(); });

function download(name, content, type){
  const b = new Blob([content], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csv(name, rows){
  const s = rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(',')).join('\r\n');
  download(name, '﻿'+s, 'text/csv;charset=utf-8');
}

/* ========== 導覽 ========== */
$$('#nav button').forEach(b => b.onclick = () => go(b.dataset.t));
function go(t){
  cur = t;
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t===t));
  $$('main>section').forEach(s => s.classList.toggle('on', s.id==='s-'+t));
  render();
  window.scrollTo(0,0);
}
function render(){
  ({dash:rDash, items:rItems, in:rIn, out:rOut, count:rCount, log:rLog, report:rReport, set:rSet})[cur]();
  rBanner();
}
function rBanner(){
  const lb = db.settings.lastBackup;
  const need = db.items.length && (!lb || daysTo(lb) < -7);
  $('#bkBanner').innerHTML = need
    ? `<div class="banner"><span>⚠️ ${lb ? '上次備份是 '+esc(lb)+'，已超過 7 天' : '還沒有備份過'}。清除瀏覽器資料會讓庫存紀錄消失，建議每週備份一次。</span><button class="btn s" onclick="backup()">立即備份</button></div>`
    : '';
}
function fillStaff(){
  $$('.staffSel').forEach(sel => {
    const v = sel.value;
    sel.innerHTML = '<option value="">— 經手人 —</option>' + db.settings.staff.map(s => `<option>${esc(s)}</option>`).join('');
    if(db.settings.staff.includes(v)) sel.value = v;
  });
}
function fillItemSel(sel, filter){
  const v = sel.value;
  const items = db.items.filter(i => isActive(i) && (!filter || filter(i)));
  let h = `<option value="">— 請選擇品項（共 ${items.length} 項）—</option>`;
  allCats().forEach(c => {
    const g = items.filter(i => i.category===c).sort((a,b) => a.name.localeCompare(b.name,'zh-Hant'));
    if(g.length) h += `<optgroup label="${esc(c)}">` + g.map(i => `<option value="${i.id}">${esc(itemLabel(i))}｜庫存 ${num(stock(i.id))} ${esc(i.unit)}</option>`).join('') + '</optgroup>';
  });
  sel.innerHTML = h;
  if([...sel.options].some(o => o.value===v)) sel.value = v;
}
function matchQ(it, q){ q = q.trim().toLowerCase(); if(!q) return true; return [it.name,it.brand,it.spec,it.location,it.supplier,it.category].join(' ').toLowerCase().includes(q); }

/* ========== 總覽 ========== */
function rDash(){
  const act = db.items.filter(isActive);
  const low = act.filter(isLow);
  const withExp = db.lots.filter(l => l.qty>0 && l.expiry && isActive(item(l.itemId)||{}));
  const near = withExp.filter(l => expStatus(l.expiry)==='near');
  const expd = withExp.filter(l => expStatus(l.expiry)==='expired');
  const m = monthStats(thisMonth());
  const total = db.lots.reduce((s,l) => s+l.qty*l.cost, 0);
  let h = '';
  if(!db.items.length){
    h += `<div class="card empty">目前還沒有任何品項。<br><br>
      <button class="btn" onclick="openItem()">新增第一個品項</button>
      <button class="btn o" onclick="loadDemo()">先載入範例資料看看</button>
      <p class="muted">範例資料之後可以在「設定與備份」一鍵清除。</p></div>`;
  }
  h += `<div class="kpis">
    <div class="kpi"><div class="l">啟用中品項</div><div class="v">${act.length}</div></div>
    <div class="kpi ${low.length?'red':''}"><div class="l">低於安全庫存</div><div class="v">${low.length}</div></div>
    <div class="kpi ${near.length?'yel':''}"><div class="l">即期批號（${db.settings.nearDays} 天內）</div><div class="v">${near.length}</div></div>
    <div class="kpi ${expd.length?'red':''}"><div class="l">已過期批號（尚有庫存）</div><div class="v">${expd.length}</div></div>
    <div class="kpi"><div class="l">本月臨床耗用</div><div class="v">${money(m.use)}</div></div>
    <div class="kpi"><div class="l">目前庫存總值</div><div class="v">${money(total)}</div></div>
  </div>`;

  // 待叫貨
  h += `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">待叫貨清單</h2>
    <span class="noprint">${low.length?'<button class="btn o s" onclick="exportOrder()">匯出叫貨單 CSV</button>':''}</span></div>`;
  if(!low.length) h += '<div class="empty">目前所有品項都在安全庫存以上 👍</div>';
  else{
    let est = 0;
    h += `<div class="tw"><table><tr><th>品項</th><th>分類</th><th>供應商</th><th class="n">現量</th><th class="n">安全量</th><th class="n">建議叫貨量</th><th class="n">參考單價</th><th class="n">估計金額</th></tr>`;
    low.sort((a,b) => (a.supplier||'').localeCompare(b.supplier||'','zh-Hant')).forEach(it => {
      const sug = Math.ceil(it.safety*2 - stock(it.id)); est += sug*(it.price||0);
      h += `<tr><td>${esc(itemLabel(it))}</td><td>${esc(it.category)}</td><td>${esc(it.supplier)||'<span class="muted">未填</span>'}</td>
        <td class="n neg">${num(stock(it.id))} ${esc(it.unit)}</td><td class="n">${num(it.safety)}</td><td class="n"><b>${sug}</b> ${esc(it.unit)}</td>
        <td class="n">${money(it.price)}</td><td class="n">${money(sug*(it.price||0))}</td></tr>`;
    });
    h += `<tr><td colspan="7" class="n"><b>合計</b></td><td class="n"><b>${money(est)}</b></td></tr></table></div>
      <p class="muted">建議叫貨量 = 安全量 × 2 − 現量，只是參考，請依實際用量調整。依供應商排序，方便分別叫貨。</p>`;
  }
  h += '</div>';

  // 效期提醒
  const alerts = [...expd, ...near].sort(fefo);
  h += `<div class="card"><h2>效期提醒</h2>`;
  if(!alerts.length) h += `<div class="empty">沒有 ${db.settings.nearDays} 天內到期或已過期的批號</div>`;
  else{
    h += `<div class="tw"><table><tr><th>品項</th><th>批號</th><th>效期</th><th class="n">數量</th><th>存放位置</th><th class="noprint"></th></tr>`;
    alerts.forEach(l => {
      const it = item(l.itemId);
      h += `<tr><td>${esc(itemLabel(it))}</td><td>${esc(lotName(l))}</td><td>${expTag(l.expiry)}</td><td class="n">${num(l.qty)} ${esc(it.unit)}</td><td>${esc(it.location)}</td>
        <td class="noprint">${expStatus(l.expiry)==='expired'?`<button class="btn r s" onclick="prefillOut('${it.id}','${l.id}','過期報廢')">報廢出庫</button>`:`<button class="btn o s" onclick="prefillOut('${it.id}','${l.id}','臨床使用')">優先使用</button>`}</td></tr>`;
    });
    h += '</table></div>';
  }
  h += '</div>';
  $('#s-dash').innerHTML = h;
}
function exportOrder(){
  const rows = [['供應商','分類','品名','廠牌','規格','單位','現量','安全量','建議叫貨量','參考單價','估計金額']];
  db.items.filter(isLow).sort((a,b)=>(a.supplier||'').localeCompare(b.supplier||'','zh-Hant')).forEach(it => {
    const sug = Math.ceil(it.safety*2 - stock(it.id));
    rows.push([it.supplier,it.category,it.name,it.brand,it.spec,it.unit,stock(it.id),it.safety,sug,it.price||0,Math.round(sug*(it.price||0))]);
  });
  csv(`叫貨單_${today()}.csv`, rows);
}

/* ========== 庫存清單 ========== */
['#qItem','#fCat','#fLow','#fInactive'].forEach(s => $(s).addEventListener('input', () => rItems()));
function rItems(){
  const fc = $('#fCat'), v = fc.value;
  fc.innerHTML = '<option value="">全部分類</option>' + allCats().map(c => `<option>${esc(c)}</option>`).join('');
  fc.value = v;
  const q = $('#qItem').value, low = $('#fLow').checked, inact = $('#fInactive').checked;
  const list = db.items.filter(it => (inact || isActive(it)) && (!v || it.category===v) && (!low || isLow(it)) && matchQ(it,q))
    .sort((a,b) => allCats().indexOf(a.category)-allCats().indexOf(b.category) || a.name.localeCompare(b.name,'zh-Hant'));
  $('#itemsCount').textContent = `顯示 ${list.length} 項`;
  if(!list.length){ $('#itemsTbl').innerHTML = '<div class="empty">沒有符合的品項</div>'; return; }
  let h = `<table><tr><th>品項</th><th>分類</th><th>存放位置</th><th class="n">現量</th><th class="n">安全量</th><th class="n">庫存值</th><th>最近效期</th><th>狀態</th><th></th></tr>`;
  list.forEach(it => {
    const st = stock(it.id), ls = lotsOf(it.id,true), ne = ls.find(l => l.expiry);
    let tag;
    if(!isActive(it)) tag = '<span class="tag t-gry">停用</span>';
    else if(st<=0) tag = '<span class="tag t-red">缺貨</span>';
    else if(isLow(it)) tag = '<span class="tag t-red">低庫存</span>';
    else tag = '<span class="tag t-grn">正常</span>';
    h += `<tr><td><b>${esc(it.name)}</b><br><span class="muted">${esc([it.brand,it.spec].filter(Boolean).join(' '))}</span></td>
      <td>${esc(it.category)}</td><td>${esc(it.location)}</td>
      <td class="n ${isLow(it)?'neg':''}"><b>${num(st)}</b> ${esc(it.unit)}</td><td class="n">${it.safety?num(it.safety):'—'}</td>
      <td class="n">${money(stockValue(it.id))}</td><td>${ne?expTag(ne.expiry):'<span class="muted">—</span>'}</td><td>${tag}</td>
      <td style="white-space:nowrap"><button class="btn o s" onclick="openDetail('${it.id}')">明細</button> <button class="btn o s" onclick="openItem('${it.id}')">編輯</button></td></tr>`;
  });
  $('#itemsTbl').innerHTML = h + '</table>';
}
function exportItems(){
  const rows = [['分類','品名','廠牌','規格','單位','存放位置','供應商','參考單價','安全量','現量','庫存值','批號','效期','批號數量','狀態']];
  db.items.forEach(it => {
    const ls = lotsOf(it.id,true);
    const base = [it.category,it.name,it.brand,it.spec,it.unit,it.location,it.supplier,it.price||0,it.safety||0,stock(it.id),Math.round(stockValue(it.id))];
    const stt = !isActive(it)?'停用':isLow(it)?'低庫存':'正常';
    if(!ls.length) rows.push([...base,'','','',stt]);
    else ls.forEach(l => rows.push([...base,l.lot,l.expiry,l.qty,stt]));
  });
  csv(`庫存表_${today()}.csv`, rows);
}

  const used = id && db.txns.some(t => t.itemId===id);
  openM(`<h2>${id?'編輯品項':'新增品項'}</h2>
  <form id="fItem" class="form" autocomplete="off">
    <label class="full">品名 *<input name="name" required value="${esc(it.name)}" placeholder="例如：複合樹脂 A2"></label>
    <label>分類<select name="category">${allCats().map(c => `<option ${c===it.category?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
    <label>廠牌<input name="brand" value="${esc(it.brand)}"></label>
    <label>規格／型號<input name="spec" value="${esc(it.spec)}"></label>
    <label>單位 *<input name="unit" required list="unitList" value="${esc(it.unit)}" placeholder="盒、支、包、瓶、顆"></label>
    <label>存放位置<input name="location" value="${esc(it.location)}" placeholder="例如：材料室 A 櫃 2 層"></label>
    <label>供應商<input name="supplier" value="${esc(it.supplier)}"></label>
    <label>參考單價（元）<input type="number" min="0" step="any" name="price" value="${esc(it.price)}"></label>
    <label>安全庫存量<input type="number" min="0" step="any" name="safety" value="${esc(it.safety)}" placeholder="低於這個數量會提醒叫貨"></label>
    <label class="full">備註<input name="note" value="${esc(it.note)}"></label>
    ${id?`<label class="chk full"><input type="checkbox" name="active" ${isActive(it)?'checked':''}> 啟用中（不再使用的品項取消勾選，紀錄會保留）</label>`:''}
    <div class="full row" style="margin:0">
      <button class="btn">儲存</button><button type="button" class="btn o" onclick="closeM()">取消</button>
      ${id?(used?'<span class="muted">此品項已有異動紀錄，不能刪除；不再使用請取消「啟用中」。</span>':`<button type="button" class="btn r" onclick="delItem('${id}')">刪除品項</button>`):''}
    </div>
  </form>
  ${id?'':'<p class="muted">參考單價會在每次入庫時自動更新成最近一次的進價。</p>'}`);
  $('#fItem').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const o = {name:f.get('name').trim(), category:f.get('category'), brand:f.get('brand').trim(), spec:f.get('spec').trim(), unit:f.get('unit').trim(),
      location:f.get('location').trim(), supplier:f.get('supplier').trim(), price:+f.get('price')||0, safety:+f.get('safety')||0, note:f.get('note').trim()};
    if(!o.name || !o.unit) return toast('品名和單位一定要填');
    const dup = db.items.find(x => x.id!==id && x.name===o.name && x.brand===o.brand && x.spec===o.spec);
    if(dup && !confirm('已經有一樣品名、廠牌、規格的品項，確定還要再建一個嗎？')) return;
    if(id){ Object.assign(it, o, {active: f.get('active')==='on'}); }
    else db.items.push(Object.assign({id:uid(), active:true}, o));
    save(); closeM(); toast(id?'已更新品項':'已新增品項'); render();
  };
}
function delItem(id){
  if(db.txns.some(t => t.itemId===id)) return toast('已有異動紀錄，不能刪除');
  if(!confirm('確定刪除這個品項？')) return;
  db.items = db.items.filter(i => i.id!==id); db.lots = db.lots.filter(l => l.itemId!==id);
  save(); closeM(); toast('已刪除'); render();
}
function openDetail(id){
  const it = item(id), ls = lotsOf(id,false).filter(l => l.qty!==0);
  const tx = db.txns.filter(t => t.itemId===id).sort((a,b) => b.date.localeCompare(a.date) || b.createdAt-a.createdAt).slice(0,20);
  let h = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(itemLabel(it))}</h2><button class="btn o s" onclick="closeM()">關閉</button></div>
    <p class="muted">${esc(it.category)}・位置：${esc(it.location)||'未填'}・供應商：${esc(it.supplier)||'未填'}・參考單價 ${money(it.price)}・安全量 ${num(it.safety)} ${esc(it.unit)}${it.note?'・'+esc(it.note):''}</p>
    <div class="row"><button class="btn s" onclick="closeM();prefillIn('${id}')">入庫</button>${stock(id)>0?`<button class="btn o s" onclick="closeM();prefillOut('${id}')">出庫</button>`:''}</div>
    <h3>批號庫存（現量 ${num(stock(id))} ${esc(it.unit)}，庫存值 ${money(stockValue(id))}）</h3>`;
  if(!ls.length) h += '<div class="empty">目前沒有庫存</div>';
  else{
    h += '<div class="tw"><table><tr><th>批號</th><th>效期</th><th class="n">數量</th><th class="n">成本單價</th><th class="n">小計</th></tr>';
    ls.forEach(l => h += `<tr><td>${esc(lotName(l))}</td><td>${expTag(l.expiry)}</td><td class="n">${num(l.qty)}</td><td class="n">${money(l.cost)}</td><td class="n">${money(l.qty*l.cost)}</td></tr>`);
    h += '</table></div>';
  }
  h += '<h3>最近 20 筆異動</h3>' + (tx.length ? txTable(tx,false) : '<div class="empty">尚無異動</div>');
  openM(h);
}

/* ========== 共用：異動表格 ========== */
function txSign(t){ return t.type==='in' ? t.qty : t.type==='out' ? -t.qty : t.qty; }
function txTable(list, withAction){
  let h = `<table><tr><th>日期</th><th>類型</th><th>品項</th><th>批號／效期</th><th class="n">數量</th><th class="n">單價</th><th class="n">金額</th><th>原因</th><th>經手人</th><th>備註</th>${withAction?'<th></th>':''}</tr>`;
  list.forEach(t => {
    const it = item(t.itemId)||{name:'(已刪除)',unit:''}, l = lot(t.lotId), s = txSign(t);
    const typeTag = t.type==='in'?'<span class="tag t-grn">入庫</span>':t.type==='out'?'<span class="tag t-yel">出庫</span>':'<span class="tag t-gry">盤點調整</span>';
    h += `<tr class="${t.void?'void':''}"><td style="white-space:nowrap">${esc(t.date)}</td><td>${typeTag}</td><td>${esc(itemLabel(it))}</td>
      <td>${esc(lotName(l))}${l&&l.expiry?'<br><span class="muted">'+esc(l.expiry)+'</span>':''}</td>
      <td class="n ${s<0?'neg':'pos'}">${s>0?'+':''}${num(s)} ${esc(it.unit)}</td><td class="n">${money(t.cost)}</td><td class="n">${money(Math.abs(t.qty)*t.cost)}</td>
      <td>${esc(t.reason)}</td><td>${esc(t.operator)}</td><td>${esc(t.note)}${t.void?' <span class="tag t-gry">已作廢</span>':''}</td>
      ${withAction?`<td>${t.void?'':`<button class="btn r s" onclick="voidTx('${t.id}')">作廢</button>`}</td>`:''}</tr>`;
  });
  return h + '</table>';
}

/* ========== 入庫 ========== */
const fIn = $('#fIn');
$('#inSearch').addEventListener('input', e => { fillItemSel($('#inItem'), it => matchQ(it, e.target.value)); onInItem(); });
$('#inItem').addEventListener('change', onInItem);
function onInItem(){
  const it = item($('#inItem').value);
  $('#inUnit').textContent = it ? '（'+it.unit+'）' : '';
  if(it){
    fIn.cost.value = it.price || '';
    if(!fIn.supplier.value || fIn.supplier.dataset.auto==='1'){ fIn.supplier.value = it.supplier||''; fIn.supplier.dataset.auto = '1'; }
    $('#inHint').textContent = `目前庫存 ${num(stock(it.id))} ${it.unit}`;
  } else $('#inHint').textContent = '';
}
fIn.supplier.addEventListener('input', () => fIn.supplier.dataset.auto = '0');
function rIn(){
  fillStaff();
  fillItemSel($('#inItem'), it => matchQ(it, $('#inSearch').value));
  if(!fIn.date.value) fIn.date.value = today();
  onInItem();
  const list = db.txns.filter(t => t.type==='in' && t.date===today() && !t.void).sort((a,b)=>b.createdAt-a.createdAt);
  $('#inToday').innerHTML = list.length ? txTable(list,false) : '<div class="empty">今天還沒有入庫</div>';
}
fIn.onsubmit = e => {
  e.preventDefault();
  const f = new FormData(fIn), it = item(f.get('itemId'));
  if(!it) return toast('請選擇品項');
  const qty = +f.get('qty'), cost = +f.get('cost');
  if(!(qty>0)) return toast('數量要大於 0');
  if(cost<0 || isNaN(cost)) return toast('請填進貨單價');
  if(!f.get('operator')) return toast('請選擇經手人');
  const lotNo = f.get('lot').trim(), exp = f.get('expiry');
  if(exp && daysTo(exp)<0 && !confirm('這個效期已經過期了，確定要入庫嗎？')) return;
  if(!exp && !confirm('沒有填效期，確定這個品項沒有效期嗎？')) return;
  let l = db.lots.find(x => x.itemId===it.id && x.lot===lotNo && (x.expiry||'')===exp);
  if(l){ const tq = l.qty+qty; l.cost = tq>0 ? (l.qty*l.cost + qty*cost)/tq : cost; l.qty = r2(tq); }
  else{ l = {id:uid(), itemId:it.id, lot:lotNo, expiry:exp, qty:r2(qty), cost}; db.lots.push(l); }
  it.price = cost;
  const sup = f.get('supplier').trim(); if(sup && !it.supplier) it.supplier = sup;
  db.txns.push({id:uid(), date:f.get('date'), type:'in', itemId:it.id, lotId:l.id, qty:r2(qty), cost, operator:f.get('operator'), reason:'進貨',
    note:[sup&&sup!==it.supplier?'供應商：'+sup:'', f.get('note').trim()].filter(Boolean).join('；'), void:false, createdAt:Date.now()});
  save();
  toast(`已入庫：${it.name} ${num(qty)} ${it.unit}`);
  ['qty','cost','lot','expiry','note'].forEach(k => fIn[k].value = '');
  $('#inSearch').value = ''; fIn.itemId.value = ''; fIn.supplier.value = ''; fIn.supplier.dataset.auto = '1';
  rIn();
};
function prefillIn(itemId){ go('in'); $('#inSearch').value = ''; fillItemSel($('#inItem')); $('#inItem').value = itemId; onInItem(); fIn.qty.focus(); }

/* ========== 出庫 ========== */
const fOut = $('#fOut');
$('#outReason').innerHTML = OUT_REASONS.map(r => `<option>${r}</option>`).join('');
$('#outSearch').addEventListener('input', e => { fillItemSel($('#outItem'), it => stock(it.id)>0 && matchQ(it, e.target.value)); onOutItem(); });
$('#outItem').addEventListener('change', onOutItem);
$('#outLot').addEventListener('change', onOutLot);
function onOutItem(keepLot){
  const it = item($('#outItem').value), sel = $('#outLot');
  $('#outUnit').textContent = it ? '（'+it.unit+'）' : '';
  if(!it){ sel.innerHTML = '<option value="">— 先選品項 —</option>'; $('#outInfo').innerHTML = '請先選擇品項'; return; }
  const ls = lotsOf(it.id,true);
  sel.innerHTML = ls.map(l => `<option value="${l.id}">${esc(lotName(l))}｜效期 ${esc(l.expiry||'無')}｜剩 ${num(l.qty)} ${esc(it.unit)}</option>`).join('');
  if(keepLot && ls.some(l => l.id===keepLot)) sel.value = keepLot;
  onOutLot();
}
function onOutLot(){
  const it = item($('#outItem').value), l = lot($('#outLot').value);
  if(!it || !l){ $('#outInfo').innerHTML = '這個品項目前沒有庫存'; return; }
  const first = lotsOf(it.id,true)[0];
  let h = `批號 <b>${esc(lotName(l))}</b>，效期 ${expTag(l.expiry)}，可出庫 <b>${num(l.qty)} ${esc(it.unit)}</b>，成本 ${money(l.cost)}／${esc(it.unit)}。位置：${esc(it.location)||'未填'}`;
  if(first && first.id!==l.id) h += `<br><span class="tag t-yel">提醒</span> 還有效期更早的批號（${esc(lotName(first))}，${esc(first.expiry)}），建議先用那一批。`;
  if(expStatus(l.expiry)==='expired' && $('#outReason').value==='臨床使用') h += `<br><span class="tag t-red">注意</span> 這一批已經過期，不應臨床使用，請改選「過期報廢」。`;
  $('#outInfo').innerHTML = h;
}
$('#outReason').addEventListener('change', onOutLot);
function rOut(){
  fillStaff();
  const keep = $('#outLot').value;
  fillItemSel($('#outItem'), it => stock(it.id)>0 && matchQ(it, $('#outSearch').value));
  if(!fOut.date.value) fOut.date.value = today();
  onOutItem(keep);
  const list = db.txns.filter(t => t.type==='out' && t.date===today() && !t.void).sort((a,b)=>b.createdAt-a.createdAt);
  $('#outToday').innerHTML = list.length ? txTable(list,false) : '<div class="empty">今天還沒有出庫</div>';
}
fOut.onsubmit = e => {
  e.preventDefault();
  const f = new FormData(fOut), it = item(f.get('itemId')), l = lot(f.get('lotId'));
  if(!it || !l) return toast('請選擇品項和批號');
  if(!f.get('operator')) return toast('請選擇經手人');
  const qty = +f.get('qty');
  if(!(qty>0)) return toast('數量要大於 0');
  if(qty > l.qty + 1e-9) return toast(`這個批號只剩 ${num(l.qty)} ${it.unit}，數量不夠`);
  if(expStatus(l.expiry)==='expired' && f.get('reason')==='臨床使用' && !confirm('這一批已經過期，確定要登記成「臨床使用」嗎？')) return;
  l.qty = r2(l.qty - qty);
  db.txns.push({id:uid(), date:f.get('date'), type:'out', itemId:it.id, lotId:l.id, qty:r2(qty), cost:l.cost, operator:f.get('operator'), reason:f.get('reason'), note:f.get('note').trim(), void:false, createdAt:Date.now()});
  save();
  toast(`已出庫：${it.name} ${num(qty)} ${it.unit}` + (isLow(it) ? '（已低於安全庫存，記得叫貨）' : ''));
  fOut.qty.value = ''; fOut.note.value = ''; $('#outReason').value = '臨床使用';
  $('#outSearch').value = ''; fOut.itemId.value = '';
  rOut();
};
function prefillOut(itemId, lotId, reason){
  closeM(); go('out'); $('#outSearch').value = '';
  fillItemSel($('#outItem'), it => stock(it.id)>0);
  $('#outItem').value = itemId; if(reason) $('#outReason').value = reason;
  onOutItem(lotId); fOut.qty.focus();
}

/* ========== 盤點 ========== */
$('#cCat').addEventListener('change', rCount);
$('#cZero').addEventListener('change', rCount);
function rCount(){
  fillStaff();
  if(!$('#cDate').value) $('#cDate').value = today();
  const cs = $('#cCat'), v = cs.value;
  cs.innerHTML = '<option value="">全部分類</option>' + allCats().map(c => `<option>${esc(c)}</option>`).join(''); cs.value = v;
  const zero = $('#cZero').checked;
  const rows = [];
  db.items.filter(it => isActive(it) && (!v || it.category===v)).forEach(it => lotsOf(it.id,false).forEach(l => { if(zero || l.qty>0) rows.push({it,l}); }));
  rows.sort((a,b) => (a.it.location||'').localeCompare(b.it.location||'','zh-Hant') || a.it.name.localeCompare(b.it.name,'zh-Hant') || fefo(a.l,b.l));
  $('#countPrintHead').innerHTML = `<p>盤點日期：＿＿＿＿＿＿　盤點人：＿＿＿＿＿＿　分類：${esc(v||'全部')}　列印時間：${today()}</p>`;
  if(!rows.length){ $('#countTbl').innerHTML = '<div class="empty">沒有可以盤點的批號</div>'; return; }
  let h = '<table><tr><th>存放位置</th><th>品項</th><th>批號</th><th>效期</th><th class="n">帳面數量</th><th>實際數量</th><th class="n">差異</th></tr>';
  rows.forEach(({it,l}) => {
    h += `<tr><td>${esc(it.location)}</td><td>${esc(itemLabel(it))}</td><td>${esc(lotName(l))}</td><td>${expTag(l.expiry)}</td>
      <td class="n">${num(l.qty)} ${esc(it.unit)}</td>
      <td><input type="number" min="0" step="any" data-lot="${l.id}" placeholder="${num(l.qty)}" style="width:110px" oninput="countDiff(this)"></td>
      <td class="n" id="d-${l.id}"></td></tr>`;
  });
  $('#countTbl').innerHTML = h + '</table>';
}
function countDiff(inp){
  const l = lot(inp.dataset.lot), c = $('#d-'+l.id);
  if(inp.value===''){ c.innerHTML = ''; return; }
  const d = r2(+inp.value - l.qty);
  c.innerHTML = d===0 ? '<span class="muted">相符</span>' : `<span class="${d<0?'neg':'pos'}">${d>0?'+':''}${num(d)}</span><br><span class="muted">${money(d*l.cost)}</span>`;
}
function saveCount(){
  const op = $('#cOp').value, date = $('#cDate').value || today();
  if(!op) return toast('請選擇經手人');
  const changes = [];
  $$('#countTbl input[data-lot]').forEach(inp => {
    if(inp.value==='') return;
    const l = lot(inp.dataset.lot), actual = +inp.value;
    if(isNaN(actual) || actual<0) return;
    const d = r2(actual - l.qty);
    if(d!==0) changes.push({l, actual, d});
  });
  if(!changes.length) return toast('沒有差異，帳實相符 👍');
  const amt = changes.reduce((s,c) => s + c.d*c.l.cost, 0);
  if(!confirm(`共 ${changes.length} 筆差異，差異金額 ${money(amt)}。確定儲存？`)) return;
  changes.forEach(({l,actual,d}) => {
    db.txns.push({id:uid(), date, type:'adj', itemId:l.itemId, lotId:l.id, qty:d, cost:l.cost, operator:op, reason:'盤點', note:`帳面 ${num(l.qty)} → 實際 ${num(actual)}`, void:false, createdAt:Date.now()});
    l.qty = r2(actual);
  });
  save(); toast(`已儲存 ${changes.length} 筆盤點差異`); rCount();
}

/* ========== 異動紀錄 ========== */
['#lMonth','#lType','#lQ','#lVoid'].forEach(s => $(s).addEventListener('input', rLog));
function logList(){
  const m = $('#lMonth').value, ty = $('#lType').value, q = $('#lQ').value.trim().toLowerCase(), sv = $('#lVoid').checked;
  return db.txns.filter(t => {
    if(m && !t.date.startsWith(m)) return false;
    if(ty && t.type!==ty) return false;
    if(!sv && t.void) return false;
    if(q){ const it = item(t.itemId)||{}, l = lot(t.lotId)||{}; if(![it.name,it.brand,it.spec,l.lot,t.operator,t.note,t.reason].join(' ').toLowerCase().includes(q)) return false; }
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
}
function rLog(){
  if(!$('#lMonth').dataset.init){ $('#lMonth').value = thisMonth(); $('#lMonth').dataset.init = 1; }
  const list = logList();
  $('#logTbl').innerHTML = list.length ? `<p class="muted">共 ${list.length} 筆</p>` + txTable(list,true) : '<div class="empty">沒有符合的紀錄（月份清空可以看全部）</div>';
}
function voidTx(id){
  const t = db.txns.find(x => x.id===id), l = lot(t.lotId), it = item(t.itemId);
  if(!t || t.void) return;
  const back = -txSign(t);
  if(l.qty + back < -1e-9) return toast(`這個批號目前只剩 ${num(l.qty)}，作廢後會變負數。請先作廢之後的出庫紀錄，或改用盤點調整。`);
  if(!confirm(`確定作廢這筆「${TYPE_NAME[t.type]}：${it.name} ${num(Math.abs(t.qty))} ${it.unit}」？\n批號數量會${back>0?'加回':'扣回'} ${num(Math.abs(back))}。`)) return;
  l.qty = r2(l.qty + back); t.void = true; t.voidAt = today();
  save(); toast('已作廢，數量已還原'); rLog();
}
function exportLog(){
  const rows = [['日期','類型','分類','品名','廠牌','規格','批號','效期','數量','單位','單價','金額','原因','經手人','備註','狀態']];
  logList().forEach(t => { const it = item(t.itemId)||{}, l = lot(t.lotId)||{};
    rows.push([t.date,TYPE_NAME[t.type],it.category,it.name,it.brand,it.spec,l.lot,l.expiry,txSign(t),it.unit,Math.round(t.cost*100)/100,Math.round(Math.abs(t.qty)*t.cost),t.reason,t.operator,t.note,t.void?'已作廢':'']); });
  csv(`異動紀錄_${$('#lMonth').value||'全部'}.csv`, rows);
}

/* ========== 成本報表 ========== */
$('#rMonth').addEventListener('input', rReport);
function monthStats(ym){
  const s = {buy:0, use:0, scrap:0, adj:0, byCat:{}, byItem:{}};
  db.txns.filter(t => !t.void && t.date.startsWith(ym)).forEach(t => {
    const it = item(t.itemId)||{category:'其他'}, c = it.category, a = Math.abs(t.qty)*t.cost;
    const bc = s.byCat[c] = s.byCat[c] || {buy:0,use:0,scrap:0,adj:0};
    if(t.type==='in'){ s.buy += a; bc.buy += a; }
    else if(t.type==='out'){
      if(t.reason==='臨床使用'){ s.use += a; bc.use += a; const bi = s.byItem[t.itemId] = s.byItem[t.itemId] || {qty:0,amt:0}; bi.qty += t.qty; bi.amt += a; }
      else{ s.scrap += a; bc.scrap += a; }
    }
    else{ const v = t.qty*t.cost; s.adj += v; bc.adj += v; }
  });
  return s;
}
function rReport(){
  if(!$('#rMonth').value) $('#rMonth').value = thisMonth();
  const ym = $('#rMonth').value, s = monthStats(ym);
  const valByCat = {}; db.lots.forEach(l => { const c = (item(l.itemId)||{category:'其他'}).category; valByCat[c] = (valByCat[c]||0) + l.qty*l.cost; });
  const total = Object.values(valByCat).reduce((a,b)=>a+b,0);
  let h = `<div class="kpis">
    <div class="kpi"><div class="l">進貨金額</div><div class="v">${money(s.buy)}</div></div>
    <div class="kpi"><div class="l">臨床耗用金額</div><div class="v">${money(s.use)}</div></div>
    <div class="kpi ${s.scrap?'red':''}"><div class="l">報廢／退貨金額</div><div class="v">${money(s.scrap)}</div></div>
    <div class="kpi ${s.adj<0?'red':''}"><div class="l">盤點差異（負數＝短少）</div><div class="v">${money(s.adj)}</div></div>
    <div class="kpi"><div class="l">目前庫存總值</div><div class="v">${money(total)}</div></div>
  </div>
  <p class="muted">「臨床耗用」以出庫時該批號的進貨成本計算，是真正用掉的材料成本；「進貨金額」是當月買進的金額，兩者不一定相同。「目前庫存總值」是此刻的數字，不隨月份改變。</p>
  <h3>${esc(ym)} 各分類</h3><div class="tw"><table><tr><th>分類</th><th class="n">進貨</th><th class="n">臨床耗用</th><th class="n">報廢／退貨</th><th class="n">盤點差異</th><th class="n">目前庫存值</th></tr>`;
  allCats().forEach(c => {
    const b = s.byCat[c] || {buy:0,use:0,scrap:0,adj:0};
    if(!b.buy && !b.use && !b.scrap && !b.adj && !valByCat[c]) return;
    h += `<tr><td>${esc(c)}</td><td class="n">${money(b.buy)}</td><td class="n">${money(b.use)}</td><td class="n">${money(b.scrap)}</td><td class="n ${b.adj<0?'neg':''}">${money(b.adj)}</td><td class="n">${money(valByCat[c])}</td></tr>`;
  });
  h += `<tr><td><b>合計</b></td><td class="n"><b>${money(s.buy)}</b></td><td class="n"><b>${money(s.use)}</b></td><td class="n"><b>${money(s.scrap)}</b></td><td class="n"><b>${money(s.adj)}</b></td><td class="n"><b>${money(total)}</b></td></tr></table></div>`;

  const top = Object.entries(s.byItem).sort((a,b) => b[1].amt-a[1].amt).slice(0,10);
  h += `<h3>${esc(ym)} 臨床耗用前 10 名</h3>`;
  if(!top.length) h += '<div class="empty">這個月沒有臨床耗用紀錄</div>';
  else{
    h += '<div class="tw"><table><tr><th>#</th><th>品項</th><th class="n">用量</th><th class="n">金額</th><th class="n">占比</th></tr>';
    top.forEach(([id,v],i) => { const it = item(id); h += `<tr><td>${i+1}</td><td>${esc(itemLabel(it))}</td><td class="n">${num(v.qty)} ${esc(it.unit)}</td><td class="n">${money(v.amt)}</td><td class="n">${s.use?Math.round(v.amt/s.use*100):0}%</td></tr>`; });
    h += '</table></div>';
  }

  const months = []; for(let k=5;k>=0;k--) months.push(addMonths(ym,-k));
  const ms = months.map(m => ({m, ...monthStats(m)}));
  const mx = Math.max(1, ...ms.map(x => Math.max(x.use, x.buy)));
  h += '<h3>近 6 個月趨勢</h3><div class="tw"><table><tr><th>月份</th><th class="n">進貨</th><th class="n">臨床耗用</th><th style="width:40%">臨床耗用</th><th class="n">報廢／退貨</th></tr>';
  ms.forEach(x => h += `<tr><td>${x.m}</td><td class="n">${money(x.buy)}</td><td class="n">${money(x.use)}</td><td><div class="bar" style="width:${x.use/mx*100}%"></div></td><td class="n">${money(x.scrap)}</td></tr>`);
  h += '</table></div>';
  $('#reportBody').innerHTML = h;
}
function exportReport(){
  const ym = $('#rMonth').value, s = monthStats(ym);
  const rows = [[ym+' 材料成本報表'],[],['分類','進貨','臨床耗用','報廢／退貨','盤點差異']];
  allCats().forEach(c => { const b = s.byCat[c]; if(b) rows.push([c,Math.round(b.buy),Math.round(b.use),Math.round(b.scrap),Math.round(b.adj)]); });
  rows.push(['合計',Math.round(s.buy),Math.round(s.use),Math.round(s.scrap),Math.round(s.adj)],[],['臨床耗用品項','用量','單位','金額']);
  Object.entries(s.byItem).sort((a,b)=>b[1].amt-a[1].amt).forEach(([id,v]) => { const it = item(id); rows.push([itemLabel(it), r2(v.qty), it.unit, Math.round(v.amt)]); });
  csv(`材料成本報表_${ym}.csv`, rows);
}

function rSet(){
  const st = db.settings;
  let size = 0; try{ size = (localStorage.getItem(KEY)||'').length; }catch(e){}
  const hasDemo = db.items.some(i => i.note==='範例');
  $('#s-set').innerHTML = `
  <div class="card"><h2>基本設定</h2>
    <div class="form">
      <label>經手人名單（一行一位）<textarea id="sStaff" rows="6">${esc(st.staff.join('\n'))}</textarea></label>
      <label>材料分類（一行一個，順序就是顯示順序）<textarea id="sCats" rows="6">${esc(st.categories.join('\n'))}</textarea></label>
      <label>效期提醒天數（幾天內到期算「即期」）<input type="number" id="sNear" min="1" value="${st.nearDays}"></label>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="saveSet()">儲存設定</button></div>
  </div>
  <div class="card"><h2>備份與還原</h2>
    <p>上次備份：<b>${st.lastBackup ? esc(st.lastBackup) : '尚未備份'}</b>　｜　品項 ${db.items.length}、批號 ${db.lots.length}、異動 ${db.txns.length} 筆　｜　資料大小約 ${Math.ceil(size/1024)} KB</p>
    <p class="muted">資料存在這台電腦這個瀏覽器裡。換電腦、換瀏覽器，或清除瀏覽紀錄時「勾到網站資料」，資料就會不見。建議每週按一次備份，把檔案存到雲端硬碟。</p>
    <div class="row">
      <button class="btn" onclick="backup()">下載備份檔</button>
      <label class="btn o" style="flex-direction:row;color:var(--p);font-size:14px">從備份檔還原<input type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></label>
    </div>
  </div>
  <div class="card"><h2>清除資料</h2>
    <div class="row">
      ${hasDemo?'<button class="btn o" onclick="clearDemo()">清除範例資料</button>':''}
      <button class="btn r" onclick="clearAll()">清除全部資料</button>
    </div>
  </div>`;
}
function saveSet(){
  const staff = $('#sStaff').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const cats = $('#sCats').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const near = parseInt($('#sNear').value,10);
  if(!staff.length) return toast('至少要有一位經手人');
  if(!cats.length) return toast('至少要有一個分類');
  db.settings.staff = [...new Set(staff)]; db.settings.categories = [...new Set(cats)]; db.settings.nearDays = near>0 ? near : 90;
  save(); toast('設定已儲存'); render();
}
function backup(){
  db.settings.lastBackup = today(); save();
  download(`材料庫存備份_${today()}.json`, JSON.stringify(db,null,1), 'application/json');
  toast('備份檔已下載，請存到雲端硬碟'); render();
}
function restore(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.items) || !Array.isArray(d.lots) || !Array.isArray(d.txns)) throw 0;
      if(!confirm(`備份檔內有 ${d.items.length} 個品項、${d.txns.length} 筆異動。\n還原會「覆蓋」目前所有資料，確定嗎？`)) return;
      const b = blank(); d.settings = Object.assign(b.settings, d.settings||{});
      db = d; save(); toast('已從備份還原'); render();
    }catch(e){ toast('這不是有效的備份檔'); }
    inp.value = '';
  };
  r.readAsText(f);
}
function clearDemo(){
  if(!confirm('清除所有標記為「範例」的品項和它們的紀錄？')) return;
  const ids = new Set(db.items.filter(i => i.note==='範例').map(i => i.id));
  db.items = db.items.filter(i => !ids.has(i.id)); db.lots = db.lots.filter(l => !ids.has(l.itemId)); db.txns = db.txns.filter(t => !ids.has(t.itemId));
  save(); toast('範例資料已清除'); render();
}
function clearAll(){
  const s = prompt('這會刪除全部品項與紀錄，無法復原。\n建議先下載備份。確定要清除請輸入「清除」：');
  if(s!=='清除') return;
  const keep = db.settings; db = blank(); db.settings = Object.assign(db.settings, {staff:keep.staff, categories:keep.categories, nearDays:keep.nearDays});
  save(); toast('已清除全部資料'); render();
}
